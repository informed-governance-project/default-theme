{% load django_bootstrap5 %}
{% load i18n %}
<div class="modal-content">
  <div class="modal-header bg-primary text-white px-4 small">
    <h5 class="modal-title" id="create_api_key_label">
      {% if token %}
        {% translate "API key created" %}
      {% else %}
        {% translate "New API key" %}
      {% endif %}
    </h5>
    <button type="button"
            class="btn-close btn-close-white"
            data-bs-dismiss="modal"
            aria-label="{% translate 'Close' %}">
    </button>
  </div>
  {% if token %}
    <div class="modal-body">
      <div class="alert alert-warning" role="status">
        {% translate "Copy this key now. It will not be shown again." %}
      </div>
      <label for="api_key_token" class="form-label fw-bold">
        {% translate "API key" %}
      </label>
      <div class="input-group">
        <input id="api_key_token"
               type="text"
               class="form-control font-monospace"
               value="{{ token }}"
               readonly>
        <button id="copy_api_key"
                type="button"
                class="btn btn-outline-secondary"
                data-copied-label="{% translate 'Copied' %}">
          <i class="bi bi-clipboard" aria-hidden="true"></i>
          <span>{% translate "Copy" %}</span>
        </button>
      </div>
    </div>
    <div class="modal-footer">
      <button type="button" class="btn btn-primary" data-bs-dismiss="modal">
        {% translate "Done" %}
      </button>
    </div>
    <template id="api_keys_table_update">
      {% include "parts/api_keys_table.html" %}
    </template>
  {% else %}
    <form id="create-api-key-form"
          action="{% url 'create_api_key' %}"
          method="post">
      {% csrf_token %}
      <div class="modal-body">
        {% bootstrap_form form %}
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
          {% translate "Cancel" %}
        </button>
        <button type="submit" class="btn btn-primary">
          {% translate "Create" %}
        </button>
      </div>
    </form>
  {% endif %}
</div>
