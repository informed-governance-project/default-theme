{% load i18n %}
<div class="modal-content">
  <div class="modal-header bg-primary text-white px-4 small">
    <h5 class="modal-title" id="revoke_api_key_label">
      {% translate "Confirm revocation of API key" %}
    </h5>
    <button type="button"
            class="btn-close btn-close-white"
            data-bs-dismiss="modal"
            aria-label="{% translate 'Close' %}">
    </button>
  </div>
  <form id="modal-revoke-api-key-form" method="post" action="#">
    {% csrf_token %}
    <div class="modal-body">
      <div class="alert alert-danger d-none api-key-error" role="alert">
      </div>
      <p>
        {% translate "Are you sure you want to revoke this API key?" %}
        <strong id="revoke_api_key_name"></strong>
      </p>
      <p class="mb-0 small text-muted">
        {% translate "Applications using it lose access immediately. This cannot be undone." %}
      </p>
    </div>
    <div class="modal-footer">
      <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
        {% translate "Cancel" %}
      </button>
      <button type="submit" class="btn btn-danger">
        {% translate "Revoke" %}
      </button>
    </div>
  </form>
</div>
